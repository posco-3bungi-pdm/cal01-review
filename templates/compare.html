{% extends "base.html" %}
{% block title %}LOT 나란히 비교 · CAL01{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <span class="kicker">SIDE BY SIDE</span>
    <h1>LOT 나란히 비교</h1>
  </div>
  <div class="row-gap">
    <label class="row-gap muted">채널
      <select id="sensor">
        {% for s in ['CP-Z4', 'TC-Z3', 'OP-Z3', 'TC-Z4', 'OP-Z4', 'TC-Z5', 'OP-Z5', 'TC-Z6', 'OP-Z6', 'TC-Z7', 'OP-Z7', 'TC-Z8', 'OP-Z8', 'TC-Z1', 'OP-Z1', 'TC-Z2', 'OP-Z2', 'CLN-IN', 'TC-Z9', 'TC-OUT1', 'TC-OUT2'] %}
        <option>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="segment" role="group" aria-label="시간 맞추기">
      <button type="button" data-axis="elapsed" class="on">LOT 시작부터 경과 시간</button>
      <button type="button" data-axis="clock">실제 시각</button>
    </div>
  </div>
</div>

<section class="card stack">
  <div class="row-between">
    <strong>비교할 LOT 고르기 <span class="muted" id="count"></span></strong>
    <div class="row-gap" id="grade-buttons"></div>
  </div>
  <div class="row-gap" id="lot-chips">
    {% for l in lots %}
    <button type="button" class="chip" data-lot="{{ l.lot_no }}" data-grade="{{ l.grade }}" aria-pressed="false">{{ l.lot_no[3:] }} · {{ l.grade }}</button>
    {% endfor %}
  </div>
</section>

<p class="muted small">모든 열의 세로 눈금이 같아요. 빨간 점선은 각 LOT의 평균 ±3σ, 빨간 선은 기준선 밖이에요.</p>
<div id="columns" class="columns"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='compare.js') }}"></script>
{% endblock %}
