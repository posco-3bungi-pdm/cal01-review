<line x1="74" y1="126" x2="188" y2="126" stroke="#7aa6ff" stroke-width="2" stroke-opacity="0.7"/>
<text x="74" y="158" font-size="13" fill="#efe7d6" font-weight="normal" text-anchor="start" >3σ 통계 후보 (06 노트북)</text>
<text x="74" y="184" font-size="13" fill="#efe7d6" font-weight="normal" text-anchor="start" >모델 후보 60건 (12 노트북)</text>
<text x="74" y="210" font-size="13" fill="#efe7d6" font-weight="normal" text-anchor="start" >import_candidates.py</text>
