<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<defs>
<pattern id="ruled" width="40" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="40" y2="27.5" stroke="#3d382f" stroke-width="1"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/></filter>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.5 0"/></filter>
</defs>
<rect width="1200" height="360" rx="6" fill="#24211c"/>
<rect width="1200" height="360" rx="6" filter="url(#grain)" opacity="0.07"/>
<rect width="1200" height="360" rx="6" fill="url(#ruled)"/>
<text x="56" y="44" font-size="20" fill="#efe7d6" font-weight="bold" text-anchor="start" font-family="'Nanum Myeongjo', 'Noto Serif KR', 'Apple SD Gothic Neo', serif" >후보가 들어와 정답으로 돌아가는 길</text>
