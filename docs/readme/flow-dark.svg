<line x1="374" y1="126" x2="469" y2="126" stroke="#a89f8f" stroke-width="2" stroke-opacity="0.7"/>
<text x="374" y="158" font-size="13" fill="#efe7d6" font-weight="normal" text-anchor="start" >LOT 그래프 위 노란 구간</text>
<text x="374" y="184" font-size="13" fill="#efe7d6" font-weight="normal" text-anchor="start" >채널, 시간창, 라벨 띠</text>
<text x="374" y="210" font-size="13" fill="#efe7d6" font-weight="normal" text-anchor="start" >정비 기록 줄, 1초 원본</text>
</g>
