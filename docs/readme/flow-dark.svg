<g transform="translate(1120 100) rotate(14)"><g opacity="0"><animateTransform attributeName="transform" type="scale" values="2.6;2.6;1;1" keyTimes="0;0.560;0.600;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.1 0.9 0.2 1;0 0 1 1"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.560;0.580;1" dur="9s" repeatCount="indefinite"/><circle r="30" fill="none" stroke="#ff6a5e" stroke-width="3" filter="url(#rough)"/><circle r="25" fill="none" stroke="#ff6a5e" stroke-width="1" stroke-opacity="0.7"/><text y="10" font-size="18" font-weight="bold" fill="#ff6a5e" text-anchor="middle" font-family="'Nanum Myeongjo', 'Noto Serif KR', 'Apple SD Gothic Neo', serif">v7</text></g></g>
