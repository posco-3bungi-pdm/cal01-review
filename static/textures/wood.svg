<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220">
  <!-- 나무결: 가로로 길게 늘인 잡음 무늬 -->
  <filter id="w" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.11" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.22  0 0 0 0 0.11  -1.6 0 0 0 1.05"/>
  </filter>
  <rect width="640" height="220" fill="#C79A66"/>
  <rect width="640" height="220" filter="url(#w)" opacity=".62"/>
