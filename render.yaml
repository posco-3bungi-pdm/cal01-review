# Render Blueprint: 웹 서비스 1개 + Postgres 1개 (둘 다 무료)
services:
  - type: web
    name: cal01-review
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --preload --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: DATABASE_URL
        fromDatabase:
          name: cal01-review-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TEAM_ACCESS_MEMBERS_JSON
        sync: false

databases:
  - name: cal01-review-db
    plan: free
    region: singapore
    databaseName: cal01
    user: cal01
